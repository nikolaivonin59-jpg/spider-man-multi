
name: Build RADLER Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64
        run: dotnet publish RADLER.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: RADLER-Multiplayer-Launcher-win-x64
          path: publish/
          if-no-files-found: error
